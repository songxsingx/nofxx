services:
  # Backend service (API and core logic)
  nextrade:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nextrade-trading
    restart: unless-stopped
    ports:
      - "${NEXTRADE_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      # - ./config.db:/app/config.db  # 注释掉，让数据库在容器内创建
      - ./beta_codes.txt:/app/beta_codes.txt:ro
      - ./decision_logs:/app/decision_logs
      - ./prompts:/app/prompts
      - /etc/localtime:/etc/localtime:ro  # Sync host time
    environment:
      - TZ=${NEXTRADE_TIMEZONE:-Asia/Shanghai}  # Set timezone
    networks:
      - nextrade-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nextrade-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nextrade-frontend
    restart: unless-stopped
    ports:
      - "${NEXTRADE_FRONTEND_PORT:-3000}:80"
    networks:
      - nextrade-network
    depends_on:
      - nextrade
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nextrade-network:
    driver: bridge